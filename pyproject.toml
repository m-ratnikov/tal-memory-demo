[project]
name = "tal-memory-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.8",
    "markdown>=3.10.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.50.2",
]

# Lets `uv run pytest` resolve `from app... import ...` from the project root
# (like test projects referencing the main project in a solution).
[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
